name: blade_design_system
description: "A new Flutter project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.5.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - assets/fonts/


  fonts:
    - family: TASAOrbiterDeck
      fonts:
        - asset: assets/fonts/TASAOrbiterDeck-Regular.otf
          weight: 400
        - asset: assets/fonts/TASAOrbiterDeck-Medium.otf
          weight: 500
        - asset: assets/fonts/TASAOrbiterDeck-SemiBold.otf
          weight: 600
        - asset: assets/fonts/TASAOrbiterDeck-Bold.otf
          weight: 700

    - family: TASAOrbiterDisplay
      fonts:
        - asset: assets/fonts/TASAOrbiterDisplay-Regular.otf
          weight: 400
        - asset: assets/fonts/TASAOrbiterDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/TASAOrbiterDisplay-SemiBold.otf
          weight: 600
        - asset: assets/fonts/TASAOrbiterDisplay-Bold.otf
          weight: 700
        - asset: assets/fonts/TASAOrbiterDisplay-Black.otf
          weight: 900

    - family: TASAOrbiterText
      fonts:
        - asset: assets/fonts/TASAOrbiterText-Regular.otf
          weight: 400
        - asset: assets/fonts/TASAOrbiterText-Medium.otf
          weight: 500
        - asset: assets/fonts/TASAOrbiterText-SemiBold.otf
          weight: 600
        - asset: assets/fonts/TASAOrbiterText-Bold.otf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
